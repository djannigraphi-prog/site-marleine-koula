# Déploiement automatique du serveur d'administration Marleine Koula (Cloudflare Workers).
#  - Branche admin-v2 → version d'ESSAI « marleinekoula-admin-essai » : sert aussi la page /admin/
#    et publie sur la branche admin-essai. Le site public n'est jamais modifié.
#  - Branche main → version de PRODUCTION « marleinekoula-admin » (publie sur le site public).
# Réglages dans GitHub (Settings → Secrets and variables → Actions) :
#   Secrets   : CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, CONTENU_GITHUB_TOKEN
#   Variables : FIREBASE_API_KEY (et FIREBASE_PROJECT_ID si différent de marleinekoula-admin)
# Après chaque déploiement, un compte rendu (sans aucun secret) est écrit sur la branche journal-deploiement.
name: Déployer le serveur d'administration
on:
  push:
    branches: [admin-v2, main]
    paths: ["worker/**", "admin/**", "assets/**", ".github/workflows/deployer-serveur-admin.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: serveur-admin-${{ github.ref_name }}
  cancel-in-progress: false
env:
  WRANGLER: wrangler@4.151.0
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'marleinekoula-admin' }}
  FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
  WRANGLER_SEND_METRICS: "false"
jobs:
  deployer:
    if: github.ref_name == 'admin-v2' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Choisir la version (essai ou production)
        id: cible
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "config=wrangler.toml" >> "$GITHUB_OUTPUT"; echo "nom=production" >> "$GITHUB_OUTPUT"
          else
            echo "config=wrangler-essai.toml" >> "$GITHUB_OUTPUT"; echo "nom=essai" >> "$GITHUB_OUTPUT"
          fi

      - name: Tests du serveur
        id: tests
        working-directory: worker
        run: npm test

      - name: Vérifier les réglages
        id: reglages
        env:
          A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          B: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          C: ${{ secrets.CONTENU_GITHUB_TOKEN }}
        run: |
          manque=""
          [ -n "$A" ] || manque="$manque CLOUDFLARE_API_TOKEN(secret)"
          [ -n "$B" ] || manque="$manque CLOUDFLARE_ACCOUNT_ID(secret)"
          [ -n "$C" ] || manque="$manque CONTENU_GITHUB_TOKEN(secret)"
          [ -n "$FIREBASE_API_KEY" ] || manque="$manque FIREBASE_API_KEY(variable)"
          echo "manquants=$manque" >> "$GITHUB_OUTPUT"
          if [ -n "$manque" ]; then echo "::error::Réglages manquants :$manque"; exit 1; fi

      - name: Vérifier le jeton Cloudflare (sans rien déployer)
        id: jeton
        env:
          TOK: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CPT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 1) Format : le secret doit contenir le jeton seul (pas d'espace, de guillemet ni de « Bearer »).
          if printf '%s' "$TOK" | grep -qE '[[:space:]"'"'"']|Bearer|Authorization|^-H'; then
            echo "format=incorrect" >> "$GITHUB_OUTPUT"
            echo "::error::Le secret CLOUDFLARE_API_TOKEN contient autre chose que le jeton (espace, guillemet, « -H » ou « Bearer »). Collez uniquement la valeur du jeton."
            exit 1
          fi
          echo "format=ok" >> "$GITHUB_OUTPUT"
          # 2) Le jeton est-il actif ? (jeton d'utilisateur, sinon jeton de compte)
          actif=$(curl -s -H "Authorization: Bearer $TOK" https://api.cloudflare.com/client/v4/user/tokens/verify | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('result',{}).get('status','') if d.get('success') else 'refuse')" || echo erreur)
          if [ "$actif" != "active" ]; then
            actif=$(curl -s -H "Authorization: Bearer $TOK" "https://api.cloudflare.com/client/v4/accounts/$CPT/tokens/verify" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('result',{}).get('status','') if d.get('success') else 'refuse')" || echo erreur)
          fi
          echo "actif=$actif" >> "$GITHUB_OUTPUT"
          [ "$actif" = "active" ] || { echo "::error::Jeton Cloudflare refusé ou inactif ($actif)."; exit 1; }
          # 3) Droit Workers Scripts sur le bon compte + sous-domaine workers.dev
          rep=$(curl -s -H "Authorization: Bearer $TOK" "https://api.cloudflare.com/client/v4/accounts/$CPT/workers/subdomain")
          compte=$(printf '%s' "$rep" | python3 -c "import json,sys;d=json.load(sys.stdin);print('ok' if d.get('success') else 'refuse:'+','.join(str(e.get('code'))+' '+e.get('message','') for e in d.get('errors',[])))")
          sous=$(printf '%s' "$rep" | python3 -c "import json,sys;d=json.load(sys.stdin);print((d.get('result') or {}).get('subdomain') or 'aucun')")
          echo "compte=$compte" >> "$GITHUB_OUTPUT"; echo "sous_domaine=$sous" >> "$GITHUB_OUTPUT"
          [ "$compte" = "ok" ] || { echo "::error::Le jeton n'a pas accès aux Workers de ce compte ($compte). Vérifiez CLOUDFLARE_ACCOUNT_ID et la permission Workers Scripts : Edit."; exit 1; }
          [ "$sous" != "aucun" ] || { echo "::error::Aucun sous-domaine workers.dev : ouvrez Workers & Pages dans Cloudflare et choisissez-en un."; exit 1; }
          echo "Jeton correct : format ok, actif, accès Workers sur le compte, sous-domaine $sous."

      - name: Préparer la page d'administration d'essai
        if: ${{ steps.cible.outputs.nom == 'essai' && !contains(github.event.head_commit.message, '[verifier-seulement]') }}
        run: |
          rm -rf worker/essai-public && mkdir -p worker/essai-public
          cp -r admin worker/essai-public/admin
          cp -r assets worker/essai-public/assets
          cat > worker/essai-public/admin/config.js <<'EOF'
          window.MK_ADMIN = {
            site: "https://raw.githubusercontent.com/djannigraphi-prog/site-marleine-koula/admin-essai/",
            lienSite: "https://github.com/djannigraphi-prog/site-marleine-koula/tree/admin-essai",
          };
          EOF

      - name: Déployer sur Cloudflare
        if: ${{ !contains(github.event.head_commit.message, '[verifier-seulement]') }}
        id: deploiement
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes "$WRANGLER" deploy --config "${{ steps.cible.outputs.config }}" \
            --var "FIREBASE_PROJECT_ID:$FIREBASE_PROJECT_ID" --var "FIREBASE_API_KEY:$FIREBASE_API_KEY" 2>&1 | tee deploiement.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploiement.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          [ -n "$url" ] || { echo "::error::Adresse workers.dev introuvable (sous-domaine workers.dev à choisir dans Cloudflare ?)"; exit 1; }

      - name: Enregistrer la clé GitHub (secrète) dans le serveur
        if: ${{ !contains(github.event.head_commit.message, '[verifier-seulement]') }}
        id: secret
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTENU_GITHUB_TOKEN: ${{ secrets.CONTENU_GITHUB_TOKEN }}
        run: printf '%s' "$CONTENU_GITHUB_TOKEN" | npx --yes "$WRANGLER" secret put GITHUB_TOKEN --config "${{ steps.cible.outputs.config }}"

      - name: Vérifier le serveur en ligne
        id: verification
        if: steps.deploiement.outputs.url != ''
        run: |
          url="${{ steps.deploiement.outputs.url }}"
          sleep 8
          {
            echo "sante=$(curl -s -o /dev/null -w '%{http_code}' "$url/api/sante")"
            echo "config=$(curl -s -o /dev/null -w '%{http_code}' "$url/api/config")"
            echo "contenu_sans_connexion=$(curl -s -o /dev/null -w '%{http_code}' "$url/api/contenu")"
            echo "page_admin=$(curl -s -o /dev/null -w '%{http_code}' "$url/admin/")"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Préparer l'adresse de production dans admin/config.js (branche admin-v2)
        id: config
        if: steps.cible.outputs.nom == 'essai' && steps.deploiement.outputs.url != ''
        run: |
          prod=$(echo "${{ steps.deploiement.outputs.url }}" | sed 's#//marleinekoula-admin-essai\.#//marleinekoula-admin.#')
          sed -i -E "s#^  api: \"[^\"]*\",#  api: \"$prod\",#" admin/config.js
          if ! git diff --quiet admin/config.js; then
            git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Administration : adresse du serveur ($prod)" admin/config.js
            git pull --rebase origin admin-v2 && git push origin HEAD:admin-v2
          fi
          echo "prod=$prod" >> "$GITHUB_OUTPUT"

      - name: Compte rendu (branche journal-deploiement)
        if: always()
        env:
          ETAT: ${{ job.status }}
          S1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          S2: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S3: ${{ secrets.CONTENU_GITHUB_TOKEN }}
        run: |
          d=$(mktemp -d); cd "$d"; git init -q; git checkout -q -b journal-deploiement
          git fetch -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" journal-deploiement 2>/dev/null && git checkout -q FETCH_HEAD -- . 2>/dev/null || true
          cat > "${{ steps.cible.outputs.nom }}.json" <<EOF
          {
            "date": "$(date -u +%FT%TZ)",
            "version": "${{ steps.cible.outputs.nom }}",
            "branche": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "etat": "$ETAT",
            "etapes": {
              "tests": "${{ steps.tests.outcome }}",
              "reglages": "${{ steps.reglages.outcome }}",
              "reglages_manquants": "${{ steps.reglages.outputs.manquants }}",
              "jeton_cloudflare": "${{ steps.jeton.outcome }}",
              "jeton_format": "${{ steps.jeton.outputs.format }}",
              "jeton_actif": "${{ steps.jeton.outputs.actif }}",
              "jeton_acces_workers": "${{ steps.jeton.outputs.compte }}",
              "sous_domaine_workers_dev": "${{ steps.jeton.outputs.sous_domaine }}",
              "mode": "${{ contains(github.event.head_commit.message, '[verifier-seulement]') && 'verification seulement' || 'deploiement' }}",
              "deploiement": "${{ steps.deploiement.outcome }}",
              "secret": "${{ steps.secret.outcome }}",
              "verification": "${{ steps.verification.outcome }}"
            },
            "adresse": "${{ steps.deploiement.outputs.url }}",
            "adresse_production_prevue": "${{ steps.config.outputs.prod }}",
            "controles": {
              "sante": "${{ steps.verification.outputs.sante }}",
              "config": "${{ steps.verification.outputs.config }}",
              "contenu_sans_connexion": "${{ steps.verification.outputs.contenu_sans_connexion }}",
              "page_admin": "${{ steps.verification.outputs.page_admin }}"
            },
            "journal": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          # Erreurs du déploiement, après masquage de toute valeur secrète (jamais le journal brut).
          if [ -f "$GITHUB_WORKSPACE/worker/deploiement.log" ]; then
            python3 "$GITHUB_WORKSPACE/.github/masquer-secrets.py" < "$GITHUB_WORKSPACE/worker/deploiement.log" > "${{ steps.cible.outputs.nom }}-erreurs.txt" || true
          fi
          git add -A; git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Compte rendu ${{ steps.cible.outputs.nom }} $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" journal-deploiement
