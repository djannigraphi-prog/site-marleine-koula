# Déploie le serveur d'administration (Cloudflare Worker) à chaque modification du dossier worker/,
# ou à la demande (onglet Actions → « Déployer le serveur d'administration » → Run workflow).
# Réglages nécessaires dans GitHub (Settings → Secrets and variables → Actions) :
#   Secrets   : CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, CONTENU_GITHUB_TOKEN
#   Variables : FIREBASE_PROJECT_ID
name: Déployer le serveur d'administration
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deployer-serveur-admin.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: serveur-admin, cancel-in-progress: false }
jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tests du serveur
        working-directory: worker
        run: npm test
      - name: Vérifier les réglages
        env:
          A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          B: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          C: ${{ secrets.CONTENU_GITHUB_TOKEN }}
          D: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          manque=0
          [ -n "$A" ] || { echo "::error::Secret CLOUDFLARE_API_TOKEN manquant"; manque=1; }
          [ -n "$B" ] || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID manquant"; manque=1; }
          [ -n "$C" ] || { echo "::error::Secret CONTENU_GITHUB_TOKEN manquant"; manque=1; }
          [ -n "$D" ] || { echo "::error::Variable FIREBASE_PROJECT_ID manquante"; manque=1; }
          exit $manque
      - name: Déployer sur Cloudflare
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.151.0 deploy --var "FIREBASE_PROJECT_ID:${{ vars.FIREBASE_PROJECT_ID }}"
      - name: Enregistrer la clé GitHub (secrète) dans le serveur
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTENU_GITHUB_TOKEN: ${{ secrets.CONTENU_GITHUB_TOKEN }}
        run: printf '%s' "$CONTENU_GITHUB_TOKEN" | npx --yes wrangler@4.151.0 secret put GITHUB_TOKEN
